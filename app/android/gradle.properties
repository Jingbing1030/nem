# 内存受限环境下的保守配置。
#
# 背景：构建机是 12GB 的 aarch64 服务器，且上面跑着用户的线上服务。
# 原先 -Xmx4G + Metaspace 1G 与 dart 编译进程叠加会撑爆宿主（实测触发 global OOM）。
# 这里降到 2G 堆 + 单 worker，牺牲一些速度换取不打扰线上服务。
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
android.useAndroidX=true
# ── Built-in Kotlin 开关（必须保持 false）──────────────────────────────
# Flutter 3.50 + AGP 9 引入了 Built-in Kotlin，但生态插件分成互斥的两类：
#   A) 条件式（已适配）：file_picker 11.0.3
#        if (!isAgp9OrAbove) apply plugin: 'org.jetbrains.kotlin.android'
#      → AGP 9 下跳过 KGP，指望 AGP 的 built-in Kotlin 接管；
#   B) 无条件（未适配）：device_info_plus 11.5.0（super_clipboard 的传递依赖）
#        apply plugin: 'kotlin-android'          // 裸 apply，无条件
#
# 实测结论（2026-11-12，AGP 9.3.1）：
#   builtInKotlin=false → A 类插件的 .kt 无人编译
#                         （GeneratedPluginRegistrant 报 cannot find symbol: FilePickerPlugin）
#   builtInKotlin=true  → B 类插件 apply KGP 时 AGP 直接抛
#                         IllegalStateException: "The 'org.jetbrains.kotlin.android'
#                         plugin is no longer required for Kotlin support since AGP 9.0."
#
# 所以官方默认的 false 是对的（for-app-developers 文档也明确说 false + newDsl=false
# 是 Flutter 刻意保留的 legacy KGP 默认值）。
#
# A 类插件缺的那次 apply，由 Flutter 的兜底逻辑负责补 —— 但那个兜底靠在 build 脚本里
# 正则扫文本判断 "插件是否已 apply KGP"（FlutterPluginUtils.kt 的 kgpRegexGroovy），
# **看不懂 if 条件**：file_picker 里那行在 if (!isAgp9OrAbove) {} 内部，正则照样命中
# → hasKgpPlugin=true → Flutter 跳过兜底 → 运行时插件自己也跳过 → 两头都不管。
#
# 因此我们在 android/build.gradle.kts 里对 :file_picker 显式补一次 KGP apply，
# 替 Flutter 做它漏做的那一次。详见该文件的注释。
android.newDsl=false
android.builtInKotlin=false
# --- 构建必需：让坏连接快速失败，避免 Gradle 僵死 ---
# 背景：plugins.gradle.org 走 Cloudflare，本机会出现连接僵死
# （线程栈卡在 SSL read，CLOSE-WAIT + 0% CPU，实测把 daemon 挂了 16 分钟）。
# 30 秒收不到数据就断开重试，而不是永久挂住。
systemProp.org.gradle.internal.http.socketTimeout=30000
systemProp.org.gradle.internal.http.connectionTimeout=30000
