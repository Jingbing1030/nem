# 内存受限环境下的保守配置。
#
# 背景：构建机是 12GB 的 aarch64 服务器，且上面跑着用户的线上服务。
# 原先 -Xmx4G + Metaspace 1G 与 dart 编译进程叠加会撑爆宿主（实测触发 global OOM）。
# 这里降到 2G 堆 + 单 worker，牺牲一些速度换取不打扰线上服务。
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
android.useAndroidX=true
# Flutter 模板新增的开关
android.newDsl=false
android.builtInKotlin=false
